[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "report-pipeline"
version = "3.0.3"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "xlrd>=2.0.1",
    "pypdf",
    "reportlab",
    "pillow",
    "pystray; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
