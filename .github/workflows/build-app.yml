name: Build Desktop App

# 触发条件：推送到 master、打 tag、或手动触发
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:  # 手动触发（在 Actions 页面点 Run workflow）

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其它
      matrix:
        include:
          - os: windows-latest
            spec: packaging/pyinstaller/health_report_web.spec
            artifact_name: HealthReportWeb-windows
            asset_path: HealthReportWeb-windows.zip
          - os: macos-latest
            spec: packaging/pyinstaller/health_report_web_macos_app.spec
            artifact_name: HealthReportWeb-macos
            asset_path: HealthReportWeb-macos.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl "xlrd>=2.0.1" pypdf reportlab pillow pyinstaller pystray

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/health_report_web.spec

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm --clean packaging/pyinstaller/health_report_web_macos_app.spec

      - name: Compress artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/HealthReportWeb -DestinationPath HealthReportWeb-windows.zip

      - name: Compress artifact (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y ../HealthReportWeb-macos.zip HealthReportWeb.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          retention-days: 30

  # 打 tag 时自动创建 Release 并附带产物
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
